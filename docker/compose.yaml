# Run the lg_sgu_vision system image with GPU + X11 + the repo bind-mounted.
#
#   xhost +local:root                       # allow the container to reach X (host)
#   docker compose -f docker/compose.yaml up -d --build
#   docker exec -it ros-jazzy bash /workspace/docker/install_env.sh   # once per machine
#
# The repo (build context `..`) is mounted at /workspace, so code edits and the
# .venv / ros2_overlay created by install_env.sh live on the host and survive
# `docker compose down`.
services:
  ros-jazzy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lg_sgu_vision:system
    container_name: ros-jazzy
    # host network + host IPC: ROS 2 DDS discovery and Isaac<->ROS shared memory.
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    # ros2_control 의 controller_manager 는 500 Hz(2 ms) 루프를 FIFO 실시간 우선순위로 돌리려
    # 한다. 기본 docker 권한(SYS_NICE 없음, rtprio 0)에서는 "Could not enable FIFO RT
    # scheduling policy" 로 포기하고 일반 스레드로 돌다가, 머신이 바쁘면(Isaac Sim 렌더링,
    # 다른 사용자 스택) 선점당해 "Overrun detected … missed its desired rate of 500 Hz" 가
    # 쏟아진다. mock 에서는 경고일 뿐이지만 실로봇에서는 RTDE 주기를 놓치는 일이므로 권한을 준다.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      DISPLAY: ${DISPLAY:-:1}
      # host 네트워크라 같은 머신의 다른 ROS 2 노드(기본 도메인 0)가 전부 보인다. 남의
      # /controller_manager·/robot_description·/joint_states 가 섞이면 spawner 가 엉뚱한
      # 매니저와 얘기하고 ros2_control_node 가 남의 URDF 를 받아 죽는다(2026-09-30 실측:
      # 다른 사용자의 humanoid 스택). 전용 도메인으로 격리한다 — 컨테이너의 모든 셸(앱·
      # launch·CLI)이 이 값을 물려받아야 서로 보인다. 이 값 없이 만든 컨테이너면 셸마다
      # `export ROS_DOMAIN_ID=30`.
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
      NVIDIA_VISIBLE_DEVICES: all
      # `graphics` (in `all`) makes the NVIDIA Container Toolkit inject the
      # Vulkan ICD Isaac Sim's renderer needs. Without it Isaac dies with
      # VkResult ERROR_INCOMPATIBLE_DRIVER / "no suitable CUDA GPU found".
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/workspace
    working_dir: /workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: sleep infinity
