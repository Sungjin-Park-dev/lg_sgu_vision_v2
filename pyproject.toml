[project]
name = "lg-sgu-vision"
version = "0.1.0"
description = "cuRobo workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.10.0",
    "torchvision",
    "ortools>=9.15.6755",
    "numpy",
    "scipy",
    "scikit-learn",
    "h5py",
    "trimesh",
    # STEP(.stp) 로더 — trimesh 가 이걸 통해 OpenCASCADE 로 테셀레이션한다
    "cascadio",
    # CAD(B-rep) 면 샘플러가 쓰는 OpenCASCADE 바인딩. 163MB 라 한때 optional 로 뒀었는데,
    # docker/install_env.sh 가 `uv sync` 를 extras 없이 돌려서 컨테이너마다 빠졌다.
    # 이 venv 는 이미 32GB(Isaac Sim 24GB)라 0.5% 이고, CAD 샘플러는 이제 곁다리가 아니다.
    "cadquery-ocp",
    "plotly",
    "viser>=0.2.11",
    "pyyaml",
    "warp-lang>=1.12,<1.13",
    "yourdfpy",
    "open3d",
    "coacd",
    "isaacsim[all,extscache]==6.0.0",
    "nvidia-curobo[cu12] @ git+https://github.com/NVlabs/curobo.git@v0.8.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
no-build-isolation-package = ["nvidia-curobo"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"