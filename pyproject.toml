[project]
name = "lg-sgu-vision"
version = "0.1.0"
description = "cuRobo workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.10.0",
    "torchvision",
    "ortools>=9.15.6755",
    "numpy",
    "scipy",
    "scikit-learn",
    "h5py",
    "trimesh",
    # STEP(.stp) 로더 — trimesh 가 이걸 통해 OpenCASCADE 로 테셀레이션한다
    "cascadio",
    "plotly",
    "viser>=0.2.11",
    "pyyaml",
    "warp-lang>=1.12,<1.13",
    "yourdfpy",
    "open3d",
    "coacd",
    "isaacsim[all,extscache]==6.0.0",
    "nvidia-curobo[cu12] @ git+https://github.com/NVlabs/curobo.git@v0.8.0",
]

[project.optional-dependencies]
# CAD(B-rep) 면 샘플러용 OpenCASCADE 바인딩. 163MB 라 기본 의존성에 넣지 않는다 —
# core/viewpoint/brep.py 가 쓰는 시점에 없으면 설치 방법을 안내한다.
cad = ["cadquery-ocp"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
no-build-isolation-package = ["nvidia-curobo"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"