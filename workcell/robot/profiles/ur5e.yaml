# 로봇 프로필 — 씬 YAML 의 `robot: ur5e` 이 이 파일을 고른다.
# 스키마: scripts/common/robot_profile.py. 자산은 전부 workcell/robot/ 기준 파일명.
# 관절 이름은 여기 없다 — curobo_config 의 cspace.joint_names 가 소유한다.
# 카메라·브래킷은 UR20 과 같다고 가정한다(카메라 체인·스피어를 UR20 에서 복사) — 다르면
# docs/reference/robot-camera-assets.md §5 체크리스트.
version: 1
name: ur5e
ur_type: ur5e                          # UR ROS2 드라이버 / ur_moveit_config 모델명
curobo_config: ur5e_with_camera.yml    # cuRobo — URDF 는 이 yml 의 urdf_path
xrdf: ur5e_with_camera.xrdf            # cuMotion(MoveIt)
usd: ur5e_with_camera.usd              # Isaac 실로봇 (Isaac 공식 UR5e 에셋 + 카메라)
ghost_usd: ur5e_with_camera_ghost.usd  # Isaac 미리보기 (build_ghost_usd.py --robot ur5e 산출물)
# UR20 과 같은 관절각 — UR5e 에서도 자기충돌·셀 충돌 없음(cuRobo 로 확인). 배치를 정하면 다시 고른다.
start_state_deg: [-198, -79, 101, 49, 84, 73]
