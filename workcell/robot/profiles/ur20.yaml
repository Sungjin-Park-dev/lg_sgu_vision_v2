# 로봇 프로필 — 씬 YAML 의 `robot: ur20` 이 이 파일을 고른다(없으면 ur20).
# 스키마: scripts/common/robot_profile.py. 자산은 전부 workcell/robot/ 기준 파일명.
# 관절 이름은 여기 없다 — curobo_config 의 cspace.joint_names 가 소유한다.
version: 1
name: ur20
ur_type: ur20                          # UR ROS2 드라이버 / ur_moveit_config 모델명
curobo_config: ur20_with_camera.yml    # cuRobo — URDF 는 이 yml 의 urdf_path
xrdf: ur20_with_camera.xrdf            # cuMotion(MoveIt)
usd: ur20_with_camera.usd              # Isaac 실로봇
ghost_usd: ur20_with_camera_ghost.usd  # Isaac 미리보기 (build_ghost_usd.py 산출물)
# 실제 로봇 현재 자세 기준 vSample115
start_state_deg: [-198, -79, 101, 49, 84, 73]
