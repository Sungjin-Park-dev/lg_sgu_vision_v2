# 검사 셀 씬 — cuRobo 충돌 월드와 Isaac 시각화의 단일 진실원.
#
# 좌표계: 모든 position 은 robot base_link frame [x, y, z] (m).
#         Isaac world z = robot z + config.MOUNT_HEIGHT(0.805).
# rotation 은 쿼터니언 [w, x, y, z]. 생략하면 identity.
#
# ⚠️ cuRobo 0.8 은 sphere/cylinder/capsule 을 충돌 검사에 넣지 않는다(조용히 무시).
#    그래서 scene_config.obstacle_obb() 가 우리 손으로 OBB 로 바꾼다. 플래너·viser·Isaac 이
#    모두 그 함수를 쓰므로 화면에 보이는 것이 곧 플래너가 푸는 것이다.
#
# 예약 이름: table / robot_mount / support — config.sync_support_to_target() 과
#            core/isaac/scene.py 가 이 이름으로 찾는다. 바꾸지 말 것.
#
# ── 2026-08-22: 셀 전체를 robot base Z 둘레로 +91.7612° 회전 ──────────────────
# 좌표가 로봇 base 기준이므로 "로봇을 돌린다"는 선택지는 없다(로봇이 곧 원점이다).
# 실제 셀과 어긋난 것을 맞추는 방법은 장애물 쪽을 돌리는 것뿐이다.
#
# 회전각의 근거: ROBOT_START_STATE(실기에서 읽은 관절값)로 FK 를 풀면 팔이 방위각
# -162.293° 로 뻗는데, 실제 셀에서는 그 방향에 테이블이 있다. 회전 전 씬의 테이블은
# +105.945° 에 있었다 → 차이 +91.7612° 를 셀 전체에 준다. 거리(수평 반경)는 실측이
# 불가능해 건드리지 않았다 — 방향만 맞춘 상태다.
#
# 로봇 base Z 둘레 회전은 로봇 입장에서 shoulder_pan 오프셋과 등가라(한계 ±360°),
# object_placements 의 도달성/reconfig 스윕 결과는 그대로 보존된다.
# robot_mount 는 로봇에 딸린 받침이라 셀과 같이 돌지 않는다(원점 + 정사각형).
version: 1
name: sim_default

# 물체 기본 pose. object_placements 에 없는 물체는 이 값을 쓴다.
# rotation 은 보통 identity — 물체 방향은 config 가 아니라 **메시에 베이크**한다
# (setup/prepare_object_mesh.py reorient). 그래야 viser(로컬 프레임)와 Isaac(월드 프레임)이
# 회전 차이 없이 같아 보인다. 아래 z-yaw 는 셀 회전분이다(베이크된 방향이 아니다).
target_object:
  name: target_object
  position: [-1.0964, -0.1338, -0.010]
  rotation: [0.69615576, 0.0, 0.0, 0.71789077]     # 셀 회전 z-yaw 91.7612°

# 순서가 곧 cuRobo cuboid 순서다.
# 실험실 방 USD (workcell/environment/environment.usd) 의 pose.
# **시각 전용** — 충돌 월드에 안 들어간다. 벽 충돌은 아래 wall_* 장애물이 담당한다.
# 원점은 방 바닥이고, 바닥은 robot_mount 밑면과 같은 z 여야 한다(scene_config 가 검증).
#
# 예전에는 이 값을 table.rotation 에서 파생시켰다 — 그래서 테이블만 돌려도 방이 따라
# 돌았다. 이제 방은 자기 pose 만 본다: 여기 값을 바꿔야 방이 움직인다.
environment:
  position: [-0.061469, 1.999055, -0.805]
  rotation: [0.69615576, 0.0, 0.0, 0.71789077]

obstacles:
  # 테이블 — 높이 630mm(바닥→상면). **실측 확인 완료(2026-08-24)** — 추정치 아님.
  #   base_link 기준 상면 z = -0.175 → 로봇 베이스 판(z=0)보다 175mm 아래.
  # dimensions 는 셀 회전 전과 같다(상자를 돌렸을 뿐이다).
  # ⚠️ 회전은 **z-yaw 만** 허용된다: sync_support_to_target() 이 상면 높이를
  #    position[2] + dimensions[2]/2 로 구하는데, z-yaw 는 연직 크기를 안 바꿔 이 식이
  #    그대로 맞다. x/y 축으로 기울이면 조용히 틀린다(scene_config 가 거절한다).
  - name: table
    type: cuboid
    position:   [-0.6935, -0.2214, -0.490]
    rotation:   [0.69615576, 0.0, 0.0, 0.71789077]
    dimensions: [0.910, 0.768, 0.630]
    isaac_visual: usd_table

  # 로봇 마운트 — ur10_mount.usd visual 매칭 (XY 2배 스케일 적용 후).
  # 상면이 robot frame z=0 (= robot base) 에 온다. 셀 회전과 무관(원점 + 정사각 단면).
  - name: robot_mount
    type: cuboid
    position:   [0.0, 0.0, -0.4025]
    dimensions: [0.54, 0.54, 0.805]
    isaac_visual: usd_mount

  # 작업 공간을 둘러싼 펜스 4개. 충돌 전용이라 Isaac 에서는 숨긴다(프림은 만든다 —
  # Stage 트리에서 켜면 플래너가 보는 것을 눈으로 확인할 수 있다).
  # 이름은 **셀 기준**이다(front = 테이블이 있는 쪽). 셀이 돌면 같이 돌므로 이름은 유효하다.
  - {name: wall_front, type: cuboid, position: [-1.5992, -0.0492, 0.5], rotation: [0.69615576, 0.0, 0.0, 0.71789077], dimensions: [2.2, 0.1, 3.0], isaac_visual: hidden}
  - {name: wall_back,  type: cuboid, position: [0.9995, 0.0307, 0.5],   rotation: [0.69615576, 0.0, 0.0, 0.71789077], dimensions: [2.2, 0.1, 3.0], isaac_visual: hidden}
  - {name: wall_left,  type: cuboid, position: [-0.2191, -1.0072, 0.5], rotation: [0.69615576, 0.0, 0.0, 0.71789077], dimensions: [0.1, 2.7, 3.0], isaac_visual: hidden}
  - {name: wall_right, type: cuboid, position: [-0.2806, 0.9918, 0.5],  rotation: [0.69615576, 0.0, 0.0, 0.71789077], dimensions: [0.1, 2.7, 3.0], isaac_visual: hidden}

  # 물체 받침대. position 과 dimensions[2] 는 sync_support_to_target() 이 물체 배치에서
  # 런타임에 다시 계산한다(테이블 상면 ↔ 물체 바닥을 채운다). 아래 값은 물체 로드 전 시드다.
  # dimensions[0:2] (받침대 단면)는 실제로 쓰이는 값이다. 정사각 단면이라 회전 불필요.
  - name: support
    type: cuboid
    position:   [-1.0964, -0.1338, -0.0925]
    dimensions: [0.05, 0.05, 0.165]
    isaac_visual: primitive

# 물체별 배치 (robot base_link frame). 도달성/스캔성을 최대화하는 위치·방향으로 측정 결정.
# 표에 없는 물체는 위 target_object 기본값을 쓴다.
# 실제 joined motion reconfig = scan reconfig + seam(=solved component 수-1) 을 최소화
# (1~2개 미커버 허용). 전부 base reconfig=0.
# 근거 자료: docs/reference/placement-sweep/{object}/summary.csv
# ⚠️ 아래 값은 전부 셀 회전(+91.7612°)이 이미 적용된 값이다. 스윕 당시의 회전 전 좌표가
#    필요하면 git 이력을 볼 것 — 회전은 강체변환이라 상대 기하는 그대로다.
# ⚠️ **sample 만 아루코 실측 위치다.** 나머지 셋은 스윕 산출값(추정)이다. 물체가 모두 같은
#    받침대에 놓인다면 position 도 sample 과 같아야 하지만, 확인 전이라 손대지 않았다 —
#    z 가 서로 다른 것(0.19 / 0.359)도 스윕이 높이를 자유롭게 고른 결과다.
object_placements:
  # 99/100, base0, scan reconfig2, 1 component(seam0) → 실제 ~2
  curved_structure:
    position: [-0.7360, -0.1727, 0.19]
    rotation: [0.01536897, 0.0, 0.0, -0.99988189]   # z-yaw 90° + 셀 91.7612°

  # 22/22, base0, reconfig2, 1 component
  cylinder_sample:
    position: [-0.7360, -0.1727, 0.19]
    rotation: [0.69615576, 0.0, 0.0, 0.71789077]    # 셀 91.7612° 만

  # position 은 **아루코 실측**(2026-08-24). 받침대에 마커를 놓고 로봇 베이스 기준으로
  #   측정한 값이다. 원본은 UR 컨트롤러의 'base' 프레임이라 x/y 부호를 뒤집어 base_link 로
  #   바꿨다(두 프레임은 Z 축 180° 차이 — docs/reference/robot-camera-assets.md).
  #   측정 원본(UR base, mm): x=1122.79 y=248.92 z=1.81
  #   z=+0.0018 은 받침대 상면 = 물체 바닥면. 테이블 상면(-0.175)보다 176.8mm 위이고,
  #   support 기둥 높이는 sync_support_to_target() 이 여기서 자동 계산한다(365→177mm).
  # rotation 은 **실측이 아니라 배치 스윕값을 유지**한다. 마커를 놓을 때 방향 규칙이 없어서
  #   측정된 yaw(-88.96°)는 물체 방향을 뜻하지 않는다. 물체 방향은 우리가 정하는 값이고,
  #   실측해보니 도달성 차이가 크다: 같은 위치에서 yaw -178.24°=72/74 vs -88.96°=64/74.
  #   (측정에 섞인 11° 기울기는 종이 부착 오차로 판단해 버렸다 — 평평하다고 본다.)
  # 스윕 근거(회전 전 위치 기준): 72/74, base0, scan reconfig0, 3 component(seam2)
  sample:
    position: [-1.1228, -0.2489, 0.0018]
    rotation: [0.01536897, 0.0, 0.0, -0.99988189]   # z-yaw 90° + 셀 91.7612° (스윕값)

  # 70/71, base0, reconfig3, 1 component
  square_structure:
    position: [-0.7389, -0.1438, 0.359]
    rotation: [0.36843916, 0.0, 0.0, 0.92965186]    # z-yaw 45° + 셀 91.7612°
