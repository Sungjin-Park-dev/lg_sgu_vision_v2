# 수동 실제 스캔 전용. UR/Isaac 작업셀이나 로봇 프로필을 바꾸지 않습니다.
version: 1
can_channel: can0
base_frame: base_link
tool_frame: link6
urdf: /workspace/agx_arm_ws/install/agx_arm_description/share/agx_arm_description/agx_arm_urdf/piper/urdf/piper_description.urdf
min_range_m: 0.07
max_range_m: 0.50
roi_center: [0.25, 0.0, 0.08]
roi_radius: 0.10
calibration_validation:
  max_translation_mm: 5.0
  max_rotation_deg: 2.0
capture_guard:
  stable_s: 0.5
  step_rad: 0.002
  max_age_s: 0.5
  sync_s: 0.1
depth_validation:
  border_m: 0.012
  stride: 3
  min_valid_fraction: 0.35
  min_points: 100
  max_offset_mm: 3.0
  max_p95_mm: 5.0
  max_normal_deg: 3.0
camera_topics:
  depth: /camera/camera/depth/image_rect_raw
  depth_info: /camera/camera/depth/camera_info
  color: /camera/camera/color/image_raw
  color_info: /camera/camera/color/camera_info
  device_info: /camera/camera/device_info
