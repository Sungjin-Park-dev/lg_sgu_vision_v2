# 수동 실제 스캔 전용. UR/Isaac 작업셀이나 로봇 프로필을 바꾸지 않습니다.
version: 1
can_channel: can0
base_frame: base_link
tool_frame: link6
urdf: workcell/robot/piper/piper_description.urdf   # 리포 기준 상대경로 (agx_arm_ws 원본과 바이트 동일)
min_range_m: 0.07
max_range_m: 0.50
roi_center: [0.25, 0.0, 0.08]
roi_radius: 0.10
calibration_validation:
  max_translation_mm: 5.0
  max_rotation_deg: 2.0
# 작업 좌표·보드 추적용 큰 보드 — 물체를 가운데 올린다. 인쇄: docs/assets/charuco_9x7_25mm.pdf (A4 가로, 100%).
# 인쇄한 칸이 25 mm 가 아니면 잰 값으로 square_m·marker_m 을 고친다 (marker = square × 0.72).
scan_board:
  squares_x: 9
  squares_y: 7
  square_m: 0.025
  marker_m: 0.018
  dictionary: DICT_4X4_50
  layout: opencv_4.6_even_row_legacy
# 촬영 한 장 = 멈춘 채 받은 depth 이만큼의 픽셀별 중앙값(과반 장에 값이 있는 픽셀만). 잡음·튀는 점·
# 한두 장의 구멍이 준다. 1 이면 한 장 그대로(예전 동작). 15 fps 에서 5장 ≈ 0.3 s 더 걸린다.
depth_frames: 5
capture_guard:
  stable_s: 0.5
  step_rad: 0.002
  max_age_s: 0.5
  sync_s: 0.1
depth_validation:
  border_m: 0.012
  stride: 3
  min_valid_fraction: 0.35
  min_points: 100
  max_offset_mm: 3.0
  max_p95_mm: 5.0
  max_normal_deg: 3.0
camera_topics:
  depth: /camera/camera/depth/image_rect_raw
  depth_info: /camera/camera/depth/camera_info
  color: /camera/camera/color/image_raw
  color_info: /camera/camera/color/camera_info
  device_info: /camera/camera/device_info
